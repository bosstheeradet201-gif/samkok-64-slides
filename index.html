let current=0;
const $=id=>document.getElementById(id);
function render(i){current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];
$('tag').textContent=s[3]+' · สไลด์ '+(current+1);$('title').textContent=s[0];$('body').textContent=s[1];$('note').textContent=s[2];
$('note').style.display=s[2]?'block':'none';$('counter').textContent=(current+1)+' / '+slides.length;
$('bar').style.width=((current+1)/slides.length*100)+'%';$('jump').value=current+1;
$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;
document.title=(current+1)+'. '+s[0]+' — สามก๊ก';
}
$('prev').onclick=()=>render(current-1);$('next').onclick=()=>render(current+1);
$('go').onclick=()=>render(Number($('jump').value)-1);
$('jump').addEventListener('keydown',e=>{if(e.key==='Enter')render(Number($('jump').value)-1)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){render(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){render(current-1)}if(e.key==='Home'){render(0)}if(e.key==='End'){render(slides.length-1)}});
const menu=$('menu');slides.forEach((s,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' · '+s[0];b.onclick=()=>{render(i);menu.classList.remove('open')};menu.appendChild(b)});
$('menuBtn').onclick=()=>menu.classList.toggle('open');
render(0);
</script></body></html>
